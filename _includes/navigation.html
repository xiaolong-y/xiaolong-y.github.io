<nav class="site-nav{% if include.inline %} site-nav--inline{% endif %}" aria-label="Main navigation">
  <ul>
    {% for item in site.data.navigation %}
    <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% elsif item.url == '/blog/' and page.url contains '/blog/' %} aria-current="location"{% elsif item.url == '/labs/' and page.url contains '/labs/' %} aria-current="location"{% endif %}>{{ item.title }}</a></li>
    {% endfor %}
  </ul>
</nav>
