<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-Week Calendar Widget</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Flexoki Light */
      --paper: #FFFCF0;
      --ink: #2D2B28;
      --muted: #6F6E69;
      --line: #DAD8CE;
      --panel: #F2F0E5;
      --blue: #205EA6;

      /* Gradient colors - light mode */
      --g-empty: #FFFCF0;
      --g-cream: #F8F3DC;
      --g-yellow-r: 208;
      --g-yellow-g: 162;
      --g-yellow-b: 21;
      --g-orange-r: 188;
      --g-orange-g: 82;
      --g-orange-b: 21;
      --g-red-r: 175;
      --g-red-g: 48;
      --g-red-b: 41;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #100F0F;
        --ink: #CECDC3;
        --muted: #878580;
        --line: #403E3C;
        --panel: #1C1B1A;
        --blue: #4385BE;

        /* Gradient colors - dark mode */
        --g-empty: #1C1B1A;
        --g-cream: #2A2622;
        --g-yellow-r: 208;
        --g-yellow-g: 162;
        --g-yellow-b: 21;
        --g-orange-r: 218;
        --g-orange-g: 112;
        --g-orange-b: 44;
        --g-red-r: 209;
        --g-red-g: 77;
        --g-red-b: 65;
      }
    }

    body {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 11px;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 8-Week Calendar Strip */
    .cal-strip-8w {
      display: flex;
      justify-content: center;
    }

    .cal-strip-8w-days {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    /* Week group - adds spacing every 7 days */
    .cal-strip-8w-week {
      display: flex;
      gap: 2px;
    }

    .cal-strip-8w-week:not(:last-child) {
      margin-right: 3px;
    }

    .cal-strip-8w-day {
      width: 9px;
      height: 9px;
      border: 1px solid var(--line);
      border-radius: 1.5px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      flex-shrink: 0;
    }

    .cal-strip-8w-day:hover {
      transform: scale(1.35);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      z-index: 10;
      position: relative;
    }

    .cal-strip-8w-day.weekend {
      border-radius: 50%;
    }

    .cal-strip-8w-day.today {
      border-bottom: 2px solid var(--blue);
      box-shadow: 0 1px 3px rgba(32, 94, 166, 0.2);
    }

    /* Tooltip */
    .cal-strip-8w-tooltip {
      position: fixed;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 5px 8px;
      font-size: 9px;
      color: var(--ink);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
    }

    .cal-strip-8w-tooltip.visible {
      opacity: 1;
    }

    .cal-strip-8w-tooltip .date {
      font-weight: 500;
      margin-bottom: 1px;
    }

    .cal-strip-8w-tooltip .hours {
      color: var(--muted);
    }

    .cal-strip-8w-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid transparent;
      border-top-color: var(--line);
    }

    @media (prefers-color-scheme: dark) {
      .cal-strip-8w-day:hover {
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }

      .cal-strip-8w-day.today {
        box-shadow: 0 1px 3px rgba(67, 133, 190, 0.3);
      }

      .cal-strip-8w-tooltip {
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .cal-strip-8w-day,
      .cal-strip-8w-tooltip {
        transition: none;
      }

      .cal-strip-8w-day:hover {
        transform: none;
      }
    }

    /* Responsive: wrap weeks on smaller screens */
    @media (max-width: 420px) {
      .cal-strip-8w-days {
        gap: 4px;
      }

      .cal-strip-8w-week:not(:last-child) {
        margin-right: 0;
      }
    }
  </style>
</head>
<body>

<div class="cal-strip-8w" id="cal-8w">
  <div class="cal-strip-8w-days" id="cal-8w-days"></div>
</div>
<div class="cal-strip-8w-tooltip" id="cal-8w-tooltip"></div>

<script>
(function() {
  'use strict';

  // Configuration
  const WEEKS_TO_SHOW = 8;
  const DAYS_TO_SHOW = WEEKS_TO_SHOW * 7; // 56 days

  // Get CSS custom property values
  function getCSSVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // Parse hex color to RGB
  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  // Linear interpolation
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  /**
   * Continuous color gradient for hours:
   * 0h: paper (empty)
   * 1-2h: warm cream
   * 3-4h: golden yellow
   * 5-6h: amber orange
   * 7h+: coral red
   */
  function getColorForHours(hours) {
    const t = Math.min(Math.max(hours / 8, 0), 1);

    const emptyColor = hexToRgb(getCSSVar('--g-empty'));
    const creamColor = hexToRgb(getCSSVar('--g-cream'));
    const yellowR = parseInt(getCSSVar('--g-yellow-r'));
    const yellowG = parseInt(getCSSVar('--g-yellow-g'));
    const yellowB = parseInt(getCSSVar('--g-yellow-b'));
    const orangeR = parseInt(getCSSVar('--g-orange-r'));
    const orangeG = parseInt(getCSSVar('--g-orange-g'));
    const orangeB = parseInt(getCSSVar('--g-orange-b'));
    const redR = parseInt(getCSSVar('--g-red-r'));
    const redG = parseInt(getCSSVar('--g-red-g'));
    const redB = parseInt(getCSSVar('--g-red-b'));

    let r, g, b, a;

    if (t < 0.125) {
      // 0-1h: empty to cream
      const localT = t / 0.125;
      r = lerp(emptyColor.r, creamColor.r, localT);
      g = lerp(emptyColor.g, creamColor.g, localT);
      b = lerp(emptyColor.b, creamColor.b, localT);
      a = 1;
    } else if (t < 0.375) {
      // 1-3h: cream to yellow
      const localT = (t - 0.125) / 0.25;
      r = lerp(creamColor.r, yellowR, localT);
      g = lerp(creamColor.g, yellowG, localT);
      b = lerp(creamColor.b, yellowB, localT);
      a = lerp(1, 0.4, localT);
    } else if (t < 0.625) {
      // 3-5h: yellow to orange
      const localT = (t - 0.375) / 0.25;
      r = lerp(yellowR, orangeR, localT);
      g = lerp(yellowG, orangeG, localT);
      b = lerp(yellowB, orangeB, localT);
      a = lerp(0.4, 0.55, localT);
    } else if (t < 0.875) {
      // 5-7h: orange to red
      const localT = (t - 0.625) / 0.25;
      r = lerp(orangeR, redR, localT);
      g = lerp(orangeG, redG, localT);
      b = lerp(orangeB, redB, localT);
      a = lerp(0.55, 0.65, localT);
    } else {
      // 7-8+h: saturated red
      const localT = (t - 0.875) / 0.125;
      r = redR;
      g = redG;
      b = redB;
      a = lerp(0.65, 0.75, localT);
    }

    return `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, ${a.toFixed(2)})`;
  }

  /**
   * Generate 8 weeks of simulated data with realistic patterns:
   * - Week 1-2: Normal rhythm
   * - Week 3-4: Busy period (deadline approaching)
   * - Week 5: Recovery/light week
   * - Week 6-8: Return to normal with variation
   */
  function generateSimulatedData() {
    const data = {};
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    // Seeded random for consistent display
    const weekSeed = Math.floor(Date.now() / (7 * 24 * 60 * 60 * 1000));
    let seed = weekSeed;
    const random = () => {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      return seed / 0x7fffffff;
    };

    for (let i = 0; i < DAYS_TO_SHOW; i++) {
      const date = new Date(today);
      date.setDate(date.getDate() + i);
      const dateStr = date.toISOString().split('T')[0];
      const dayOfWeek = date.getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const weekNum = Math.floor(i / 7);

      let hours = 0;
      let busyMultiplier = 1;

      // Week-based patterns
      if (weekNum === 2 || weekNum === 3) {
        // Busy weeks (deadline period)
        busyMultiplier = 1.4;
      } else if (weekNum === 4) {
        // Recovery week
        busyMultiplier = 0.4;
      } else if (weekNum === 6) {
        // Another mini-crunch
        busyMultiplier = 1.2;
      }

      if (isWeekend) {
        const rand = random();
        if (weekNum === 2 || weekNum === 3) {
          // Working weekends during crunch
          if (rand < 0.5) {
            hours = 2 + random() * 4;
          } else if (rand < 0.7) {
            hours = random() * 2;
          }
        } else if (weekNum === 4) {
          // Rest on recovery week
          hours = 0;
        } else {
          // Normal weekends
          if (rand < 0.15) {
            hours = random() * 2;
          } else if (rand < 0.25) {
            hours = 1 + random() * 2;
          }
        }
      } else {
        // Weekdays
        const rand = random();
        let baseHours = 0;

        if (rand < 0.08) {
          baseHours = random() * 0.5; // Very light / off
        } else if (rand < 0.25) {
          baseHours = 1 + random() * 2; // Light day
        } else if (rand < 0.55) {
          baseHours = 3 + random() * 2; // Normal day
        } else if (rand < 0.8) {
          baseHours = 5 + random() * 2; // Busy day
        } else {
          baseHours = 7 + random() * 2; // Very busy
        }

        hours = baseHours * busyMultiplier;

        // Monday/Friday tend to be lighter
        if (dayOfWeek === 1 || dayOfWeek === 5) {
          hours *= 0.85;
        }
        // Wednesday hump day tends to be busier
        if (dayOfWeek === 3) {
          hours *= 1.1;
        }
      }

      // Clamp to reasonable range
      hours = Math.max(0, Math.min(10, hours));
      data[dateStr] = Math.round(hours * 10) / 10;
    }

    return data;
  }

  // Format date for tooltip
  function formatDate(date) {
    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    return date.toLocaleDateString('en-US', options);
  }

  // Build the 8-week calendar
  function buildCalendar() {
    const container = document.getElementById('cal-8w-days');
    const tooltip = document.getElementById('cal-8w-tooltip');
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const data = generateSimulatedData();
    container.innerHTML = '';

    // Create 8 week groups
    for (let week = 0; week < WEEKS_TO_SHOW; week++) {
      const weekDiv = document.createElement('div');
      weekDiv.className = 'cal-strip-8w-week';

      for (let dayInWeek = 0; dayInWeek < 7; dayInWeek++) {
        const dayIndex = week * 7 + dayInWeek;
        const date = new Date(today);
        date.setDate(date.getDate() + dayIndex);
        const dateStr = date.toISOString().split('T')[0];
        const dayOfWeek = date.getDay();
        const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
        const isToday = dayIndex === 0;

        const hours = data[dateStr] || 0;

        const day = document.createElement('div');
        day.className = 'cal-strip-8w-day';
        if (isWeekend) day.classList.add('weekend');
        if (isToday) day.classList.add('today');

        day.style.backgroundColor = getColorForHours(hours);
        day.dataset.date = dateStr;
        day.dataset.hours = hours;

        // Accessibility
        day.setAttribute('role', 'gridcell');
        day.setAttribute('aria-label', `${formatDate(date)}: ${hours > 0 ? hours.toFixed(1) + ' hours' : 'Free'}`);
        day.tabIndex = 0;

        // Tooltip handling
        const showTooltip = function(e) {
          const rect = day.getBoundingClientRect();
          tooltip.innerHTML = `
            <div class="date">${formatDate(date)}</div>
            <div class="hours">${hours > 0 ? hours.toFixed(1) + 'h' : 'Free'}</div>
          `;

          // Position above the element
          let left = rect.left + rect.width / 2;
          let top = rect.top - 35;

          // Adjust for screen edges
          const tooltipWidth = 80;
          if (left < tooltipWidth / 2 + 10) left = tooltipWidth / 2 + 10;
          if (left > window.innerWidth - tooltipWidth / 2 - 10) {
            left = window.innerWidth - tooltipWidth / 2 - 10;
          }
          if (top < 10) top = rect.bottom + 8;

          tooltip.style.left = left + 'px';
          tooltip.style.top = top + 'px';
          tooltip.style.transform = 'translateX(-50%)';
          tooltip.classList.add('visible');
        };

        const hideTooltip = function() {
          tooltip.classList.remove('visible');
        };

        day.addEventListener('mouseenter', showTooltip);
        day.addEventListener('mouseleave', hideTooltip);
        day.addEventListener('focus', showTooltip);
        day.addEventListener('blur', hideTooltip);

        weekDiv.appendChild(day);
      }

      container.appendChild(weekDiv);
    }
  }

  // Initialize
  buildCalendar();

  // Re-render on color scheme change
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    buildCalendar();
  });

  // Re-render at midnight to update today marker
  function scheduleNightlyRefresh() {
    const now = new Date();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(0, 0, 1, 0);
    const msUntilMidnight = tomorrow - now;

    setTimeout(function() {
      buildCalendar();
      scheduleNightlyRefresh();
    }, msUntilMidnight);
  }

  scheduleNightlyRefresh();
})();
</script>

</body>
</html>
