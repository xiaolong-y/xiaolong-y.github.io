<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Widget v2 - Simple</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Flexoki Light */
      --paper: #FFFCF0;
      --ink: #2D2B28;
      --muted: #6F6E69;
      --line: #DAD8CE;
      --panel: #F2F0E5;
      --blue: #205EA6;
      --yellow: #AD8301;
      --orange: #BC5215;
      --red: #AF3029;

      /* Gradient stops - light mode */
      --g-empty: #FFFCF0;
      --g-light: #F5EED6;
      --g-yellow-r: 208;
      --g-yellow-g: 162;
      --g-yellow-b: 21;
      --g-orange-r: 188;
      --g-orange-g: 82;
      --g-orange-b: 21;
      --g-red-r: 175;
      --g-red-g: 48;
      --g-red-b: 41;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #100F0F;
        --ink: #CECDC3;
        --muted: #878580;
        --line: #403E3C;
        --panel: #1C1B1A;
        --blue: #4385BE;
        --yellow: #D0A215;
        --orange: #DA702C;
        --red: #D14D41;

        /* Gradient stops - dark mode */
        --g-empty: #1C1B1A;
        --g-light: #2A2825;
        --g-yellow-r: 208;
        --g-yellow-g: 162;
        --g-yellow-b: 21;
        --g-orange-r: 218;
        --g-orange-g: 112;
        --g-orange-b: 44;
        --g-red-r: 209;
        --g-red-g: 77;
        --g-red-b: 65;
      }
    }

    body {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 11px;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Calendar Strip */
    .calendar-strip {
      display: flex;
      justify-content: center;
    }

    .calendar-days {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    .calendar-day {
      width: 12px;
      height: 12px;
      border: 1px solid var(--line);
      border-radius: 2px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      flex-shrink: 0;
    }

    .calendar-day:hover {
      transform: scale(1.3);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 10;
      position: relative;
    }

    .calendar-day.weekend {
      border-radius: 50%;
    }

    .calendar-day.today {
      border-bottom: 2px solid var(--blue);
    }

    /* Tooltip */
    .calendar-tooltip {
      position: fixed;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 6px 10px;
      font-size: 10px;
      color: var(--ink);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .calendar-tooltip.visible {
      opacity: 1;
    }

    .calendar-tooltip .date {
      font-weight: 500;
      margin-bottom: 2px;
    }

    .calendar-tooltip .hours {
      color: var(--muted);
    }

    @media (prefers-color-scheme: dark) {
      .calendar-day:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .calendar-tooltip {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    }
  </style>
</head>
<body>

<div class="calendar-strip" id="calendar-strip">
  <div class="calendar-days" id="calendar-days"></div>
</div>
<div class="calendar-tooltip" id="tooltip"></div>

<script>
(function() {
  'use strict';

  // Configuration
  const DAYS_TO_SHOW = 60;
  const SQUARE_SIZE = 12;

  // Get CSS custom property values
  function getCSSVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // Parse hex color to RGB
  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  // Lerp between two values
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  // Get color for hours using continuous gradient
  function getColorForHours(hours) {
    // Clamp hours to 0-8 range and normalize
    const t = Math.min(Math.max(hours / 8, 0), 1);

    // Get gradient colors from CSS variables
    const emptyColor = hexToRgb(getCSSVar('--g-empty'));
    const lightColor = hexToRgb(getCSSVar('--g-light'));
    const yellowR = parseInt(getCSSVar('--g-yellow-r'));
    const yellowG = parseInt(getCSSVar('--g-yellow-g'));
    const yellowB = parseInt(getCSSVar('--g-yellow-b'));
    const orangeR = parseInt(getCSSVar('--g-orange-r'));
    const orangeG = parseInt(getCSSVar('--g-orange-g'));
    const orangeB = parseInt(getCSSVar('--g-orange-b'));
    const redR = parseInt(getCSSVar('--g-red-r'));
    const redG = parseInt(getCSSVar('--g-red-g'));
    const redB = parseInt(getCSSVar('--g-red-b'));

    let r, g, b, a;

    if (t < 0.125) {
      // 0-1 hours: empty to light
      const localT = t / 0.125;
      r = lerp(emptyColor.r, lightColor.r, localT);
      g = lerp(emptyColor.g, lightColor.g, localT);
      b = lerp(emptyColor.b, lightColor.b, localT);
      a = 1;
    } else if (t < 0.375) {
      // 1-3 hours: light to yellow
      const localT = (t - 0.125) / 0.25;
      r = lerp(lightColor.r, yellowR, localT);
      g = lerp(lightColor.g, yellowG, localT);
      b = lerp(lightColor.b, yellowB, localT);
      a = lerp(1, 0.45, localT);
    } else if (t < 0.625) {
      // 3-5 hours: yellow to orange
      const localT = (t - 0.375) / 0.25;
      r = lerp(yellowR, orangeR, localT);
      g = lerp(yellowG, orangeG, localT);
      b = lerp(yellowB, orangeB, localT);
      a = lerp(0.45, 0.55, localT);
    } else if (t < 0.875) {
      // 5-7 hours: orange to red
      const localT = (t - 0.625) / 0.25;
      r = lerp(orangeR, redR, localT);
      g = lerp(orangeG, redG, localT);
      b = lerp(orangeB, redB, localT);
      a = lerp(0.55, 0.65, localT);
    } else {
      // 7-8+ hours: saturate at red
      const localT = (t - 0.875) / 0.125;
      r = redR;
      g = redG;
      b = redB;
      a = lerp(0.65, 0.75, localT);
    }

    return `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, ${a.toFixed(2)})`;
  }

  // Generate varied simulated data
  function generateSimulatedData() {
    const data = {};
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    for (let i = -7; i < DAYS_TO_SHOW; i++) {
      const date = new Date(today);
      date.setDate(date.getDate() + i);
      const dateStr = date.toISOString().split('T')[0];
      const dayOfWeek = date.getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

      let hours = 0;

      // Create realistic patterns
      if (isWeekend) {
        // Weekends: mostly free, occasional light work
        const rand = Math.random();
        if (rand < 0.6) {
          hours = 0;
        } else if (rand < 0.85) {
          hours = Math.random() * 2; // 0-2 hours
        } else {
          hours = 2 + Math.random() * 3; // 2-5 hours (catching up)
        }
      } else {
        // Weekdays: varied work patterns
        const rand = Math.random();
        if (rand < 0.1) {
          // Day off or very light
          hours = Math.random() * 1;
        } else if (rand < 0.3) {
          // Light day
          hours = 1 + Math.random() * 2;
        } else if (rand < 0.6) {
          // Normal day
          hours = 3 + Math.random() * 2.5;
        } else if (rand < 0.85) {
          // Busy day
          hours = 5.5 + Math.random() * 2;
        } else {
          // Very busy day
          hours = 7 + Math.random() * 2;
        }
      }

      // Add some weekly rhythm - Mondays and Fridays tend to be lighter
      if (dayOfWeek === 1 || dayOfWeek === 5) {
        hours *= 0.85;
      }

      // Add some randomness for "vacation" stretches
      const weekNum = Math.floor((i + 7) / 7);
      if (weekNum === 2 || weekNum === 5) {
        hours *= 0.3; // Light week
      }

      data[dateStr] = Math.round(hours * 10) / 10; // Round to 1 decimal
    }

    return data;
  }

  // Format date for display
  function formatDate(date) {
    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    return date.toLocaleDateString('en-US', options);
  }

  // Build the calendar
  function buildCalendar() {
    const container = document.getElementById('calendar-days');
    const tooltip = document.getElementById('tooltip');
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const data = generateSimulatedData();

    // Generate days from 7 days ago to DAYS_TO_SHOW days ahead
    for (let i = -7; i < DAYS_TO_SHOW; i++) {
      const date = new Date(today);
      date.setDate(date.getDate() + i);
      const dateStr = date.toISOString().split('T')[0];
      const dayOfWeek = date.getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const isToday = i === 0;

      const hours = data[dateStr] || 0;

      const day = document.createElement('div');
      day.className = 'calendar-day';
      if (isWeekend) day.classList.add('weekend');
      if (isToday) day.classList.add('today');

      day.style.backgroundColor = getColorForHours(hours);
      day.dataset.date = dateStr;
      day.dataset.hours = hours;

      // Tooltip handling
      day.addEventListener('mouseenter', function(e) {
        const rect = day.getBoundingClientRect();
        tooltip.innerHTML = `
          <div class="date">${formatDate(date)}</div>
          <div class="hours">${hours > 0 ? hours.toFixed(1) + ' hours' : 'Free'}</div>
        `;

        // Position tooltip
        let left = rect.left + rect.width / 2;
        let top = rect.top - 40;

        // Adjust if near edges
        const tooltipRect = tooltip.getBoundingClientRect();
        if (left < 60) left = 60;
        if (left > window.innerWidth - 60) left = window.innerWidth - 60;
        if (top < 10) top = rect.bottom + 10;

        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';
        tooltip.style.transform = 'translateX(-50%)';
        tooltip.classList.add('visible');
      });

      day.addEventListener('mouseleave', function() {
        tooltip.classList.remove('visible');
      });

      container.appendChild(day);
    }
  }

  // Initialize
  buildCalendar();

  // Re-render on color scheme change
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    const container = document.getElementById('calendar-days');
    container.innerHTML = '';
    buildCalendar();
  });
})();
</script>

</body>
</html>
