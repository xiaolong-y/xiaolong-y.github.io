<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option D: Month Grid</title>
  <style>
    :root {
      --paper: #FFFCF0;
      --ink: #100F0F;
      --muted: #6F6E69;
      --available: #66800B;
      --occupied: #E6E4D9;
      --deadline: #D14D41;
      --line: #E6E4D9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #100F0F;
        --ink: #CECDC3;
        --muted: #878580;
        --available: #879A39;
        --occupied: #282726;
        --deadline: #D14D41;
        --line: #343331;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 2rem;
      color: var(--muted);
    }

    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .header-row {
      display: grid;
      grid-template-columns: 2.5rem repeat(7, 2.5rem) 5rem;
      gap: 0.375rem;
      margin-bottom: 0.25rem;
    }

    .header-row span {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .week-row {
      display: grid;
      grid-template-columns: 2.5rem repeat(7, 2.5rem) 5rem;
      gap: 0.375rem;
      align-items: center;
    }

    .week-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      padding-right: 0.5rem;
    }

    .day {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.25rem;
    }

    .day.available {
      background: var(--available);
    }

    .day.occupied {
      background: var(--occupied);
    }

    .day.deadline {
      background: var(--deadline);
    }

    .day.empty {
      background: transparent;
    }

    .week-count {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
      padding-left: 0.75rem;
    }

    .total-row {
      display: grid;
      grid-template-columns: 2.5rem repeat(7, 2.5rem) 5rem;
      gap: 0.375rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--line);
    }

    .total-label {
      grid-column: 1 / 9;
      text-align: right;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--ink);
    }

    .total-count {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--available);
      text-align: right;
    }

    .legend {
      display: flex;
      gap: 1.5rem;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-swatch {
      width: 1rem;
      height: 1rem;
      border-radius: 0.125rem;
    }

    .legend-swatch.available {
      background: var(--available);
    }

    .legend-swatch.occupied {
      background: var(--occupied);
    }

    .legend-swatch.deadline {
      background: var(--deadline);
    }

    .month-label {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <h1>Option D: Month Grid</h1>

  <div class="month-label">January 2025</div>

  <div class="grid-container">

    <div class="header-row">
      <span></span>
      <span>M</span>
      <span>T</span>
      <span>W</span>
      <span>T</span>
      <span>F</span>
      <span>S</span>
      <span>S</span>
      <span></span>
    </div>

    <!-- Week 1: Jan 1-5 (Wed-Sun) -->
    <div class="week-row">
      <span class="week-label">W1</span>
      <div class="day empty"></div>
      <div class="day empty"></div>
      <div class="day occupied"></div>
      <div class="day available"></div>
      <div class="day occupied"></div>
      <div class="day available"></div>
      <div class="day available"></div>
      <span class="week-count">3 days</span>
    </div>

    <!-- Week 2: Jan 6-12 -->
    <div class="week-row">
      <span class="week-label">W2</span>
      <div class="day available"></div>
      <div class="day occupied"></div>
      <div class="day occupied"></div>
      <div class="day available"></div>
      <div class="day deadline"></div>
      <div class="day available"></div>
      <div class="day available"></div>
      <span class="week-count">4 days</span>
    </div>

    <!-- Week 3: Jan 13-19 -->
    <div class="week-row">
      <span class="week-label">W3</span>
      <div class="day available"></div>
      <div class="day available"></div>
      <div class="day occupied"></div>
      <div class="day occupied"></div>
      <div class="day available"></div>
      <div class="day available"></div>
      <div class="day available"></div>
      <span class="week-count">5 days</span>
    </div>

    <!-- Week 4: Jan 20-26 -->
    <div class="week-row">
      <span class="week-label">W4</span>
      <div class="day occupied"></div>
      <div class="day available"></div>
      <div class="day available"></div>
      <div class="day occupied"></div>
      <div class="day deadline"></div>
      <div class="day available"></div>
      <div class="day available"></div>
      <span class="week-count">4 days</span>
    </div>

    <!-- Week 5: Jan 27-31 (Mon-Fri) -->
    <div class="week-row">
      <span class="week-label">W5</span>
      <div class="day available"></div>
      <div class="day available"></div>
      <div class="day occupied"></div>
      <div class="day available"></div>
      <div class="day available"></div>
      <div class="day empty"></div>
      <div class="day empty"></div>
      <span class="week-count">4 days</span>
    </div>

    <div class="total-row">
      <span class="total-label">Total available</span>
      <span class="total-count">20 days</span>
    </div>

  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch available"></div>
      <span>Available</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch occupied"></div>
      <span>Occupied</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch deadline"></div>
      <span>Deadline</span>
    </div>
  </div>

</body>
</html>
