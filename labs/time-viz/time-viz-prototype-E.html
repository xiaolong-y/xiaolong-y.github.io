  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --paper: #FFFCF0;
      --ink: #1C1B1A;
      --muted: #6F6E69;
      --available: #66800B;
      --occupied: #E6E4D9;
      --deadline: #D14D41;
      --line: #DAD8CE;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #100F0F;
        --ink: #CECDC3;
        --muted: #878580;
        --available: #879A39;
        --occupied: #282726;
        --deadline: #D14D41;
        --line: #403E3C;
      }
    }

    body {
      font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      background: var(--paper);
      color: var(--ink);
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .ribbon-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .month-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .month-label {
      width: 28px;
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    .days-bar {
      display: flex;
      gap: 1px;
      flex-grow: 1;
    }

    .day {
      width: 9px;
      height: 14px;
      border-radius: 1px;
      flex-shrink: 0;
    }

    .day.available {
      background: var(--available);
    }

    .day.occupied {
      background: var(--occupied);
    }

    .day.deadline {
      background: var(--deadline);
      position: relative;
    }

    .day.empty {
      background: transparent;
      width: 9px;
    }

    .day-count {
      width: 32px;
      font-size: 10px;
      color: var(--muted);
      text-align: right;
      flex-shrink: 0;
    }

    .day-count span {
      color: var(--ink);
      font-weight: 500;
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 1px;
    }

    .legend-swatch.available { background: var(--available); }
    .legend-swatch.occupied { background: var(--occupied); }
    .legend-swatch.deadline { background: var(--deadline); }

    .summary {
      margin-top: 12px;
      font-size: 11px;
      color: var(--muted);
    }

    .summary strong {
      color: var(--ink);
      font-weight: 600;
    }
  </style>
</head>
